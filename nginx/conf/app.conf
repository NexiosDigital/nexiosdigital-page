server {
    listen 80;
    server_name nexiosdigital.com www.nexiosdigital.com;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name nexiosdigital.com www.nexiosdigital.com;
    
    ssl_certificate /etc/letsencrypt/live/nexiosdigital.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexiosdigital.com/privkey.pem;
    
    # Configurações de segurança recomendadas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    
    # Frontend - configuração melhorada para SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        
        # Configurações para SPA (Single Page Application)
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        expires off;
        
        # Importante para debug
        add_header X-Debug-Info "Servido pelo nginx interno" always;
    }
    
    # Configuração de cache para recursos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
    
    # Configuração de erro personalizada - CRÍTICO para seu caso
    error_page 404 /index.html;
    
    # IMPORTANTE: Não adicione configurações para /api/ e /ws/ aqui
    # O Traefik está cuidando dessas rotas diretamente
}