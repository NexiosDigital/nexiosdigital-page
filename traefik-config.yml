      rule: "Host(`nexiosdigital.com`, `www.nexiosdigital.com`) && PathPrefix(`/api`)"
      service: "nexiosdigital-backend"
      entryPoints:
        - "websecure"
      tls: {}
  
  services:
    nexiosdigital-backend:
      loadBalancer:
        servers:
          - url: "http://10.0.1.139:8000"