http:
  middlewares:
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true
    cors-headers:
      headers:
        accessControlAllowOriginList:
          - "*"  # Permitir todas as origens para solucionar problemas de CORS
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - "*"
        accessControlAllowCredentials: true
        accessControlMaxAge: 100
        addVaryHeader: true
    websocket-headers:
      headers:
        customRequestHeaders:
          Connection: "Upgrade"
          Upgrade: "websocket"
    # Novo middleware para tratamento de SPA
    spa-handler:
      errors:
        status:
          - "404"
        service: "nexiosdigital-frontend"
        query: "/{path}"

  routers:
    # Roteador para API
    api:
      rule: "Host(`nexiosdigital.com`, `www.nexiosdigital.com`) && PathPrefix(`/api`)"
      service: "nexiosdigital-backend"
      entryPoints:
        - "websecure"
      tls: {}
      middlewares:
        - "cors-headers"
      priority: 100
    
    # Roteador para WebSockets - Configurado corretamente para WebSockets
    websockets:
      rule: "Host(`nexiosdigital.com`, `www.nexiosdigital.com`) && PathPrefix(`/ws`)"
      service: "nexiosdigital-backend"
      entryPoints:
        - "websecure"
      tls: {}
      middlewares:
        - "cors-headers"
        - "websocket-headers"  # Adicionar middleware específico para WebSockets
      priority: 100
    
    # Novo roteador explícito para o frontend com tratamento SPA
    frontend:
      rule: "Host(`nexiosdigital.com`, `www.nexiosdigital.com`) && !PathPrefix(`/api`, `/ws`)"
      service: "nexiosdigital-frontend"
      entryPoints:
        - "websecure"
      tls: {}
      middlewares:
        - "spa-handler"
      priority: 10
  
    # Roteador para redirecionamento HTTP para HTTPS
    http-catchall:
      rule: "hostregexp(`{host:.+}`)"
      service: "noop@internal"
      entryPoints:
        - "web"
      middlewares:
        - "https-redirect"
      priority: 1

  services:
    nexiosdigital-backend:
      loadBalancer:
        servers:
          - url: "http://backend:8000"
        passHostHeader: true
        responseForwarding:
          flushInterval: "100ms"  # Melhorar resposta para WebSockets
    
    # Definição do serviço para o frontend
    nexiosdigital-frontend:
      loadBalancer:
        servers:
          - url: "http://nginx:80"
        passHostHeader: true