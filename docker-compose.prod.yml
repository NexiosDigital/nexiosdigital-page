version: '3.3'

networks:
  # Use a rede existente do proxy
  proxy:
    external: true
  # Rede interna para comunicação entre seus serviços
  internal:

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    volumes:
      - frontend_build:/app/build
    environment:
      - REACT_APP_API_URL=https://nexiosdigital.com
      - REACT_APP_N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "127.0.0.1:8000:8000"  # Mapear porta localmente para ajudar no debugging
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - SECRET_KEY=${SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_API_TOKEN=${N8N_API_TOKEN}
    depends_on:
      - mongo
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      # CONFIGURAÇÃO SIMPLIFICADA - envia qualquer rota /api/* para o backend sem path stripping
      - "traefik.http.routers.nexios-api.rule=Host(`nexiosdigital.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.nexios-api.entrypoints=websecure"
      - "traefik.http.routers.nexios-api.tls=true"
      - "traefik.http.services.nexios-api.loadbalancer.server.port=8000"
      
      # WebSockets configuração
      - "traefik.http.routers.nexios-ws.rule=Host(`nexiosdigital.com`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.nexios-ws.entrypoints=websecure"
      - "traefik.http.routers.nexios-ws.tls=true"
      - "traefik.http.services.nexios-ws.loadbalancer.server.port=8000"

  mongo:
    image: mongo:latest
    restart: always
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - frontend_build:/usr/share/nginx/html
      - ./nginx/custom.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nexios-frontend.rule=Host(`nexiosdigital.com`) && !PathPrefix(`/api`, `/ws`)"
      - "traefik.http.routers.nexios-frontend.entrypoints=websecure"
      - "traefik.http.routers.nexios-frontend.tls=true"
      - "traefik.http.services.nexios-frontend.loadbalancer.server.port=80"

volumes:
  mongo_data:
  frontend_build:
