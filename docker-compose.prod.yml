version: '3.3'

networks:
  # Use a rede existente do proxy
  NexiosNet:
    external: true
  # Rede interna para comunicação entre seus serviços
  internal:

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    volumes:
      - frontend_build:/app/build
    environment:
      - REACT_APP_API_URL=https://nexiosdigital.com
      - REACT_APP_N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - SECRET_KEY=${SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_API_TOKEN=${N8N_API_TOKEN}
    depends_on:
      - mongo
    networks:
      - internal
      - NexiosNet  # Importante: conecte à rede do Traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nexiosdigital-api.rule=Host(`nexiosdigital.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.nexiosdigital-api.entrypoints=websecure"
      - "traefik.http.routers.nexiosdigital-api.tls=true"
      - "traefik.http.services.nexiosdigital-api.loadbalancer.server.port=8000"
      
      - "traefik.http.routers.nexiosdigital-ws.rule=Host(`nexiosdigital.com`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.nexiosdigital-ws.entrypoints=websecure"
      - "traefik.http.routers.nexiosdigital-ws.tls=true"
      - "traefik.http.services.nexiosdigital-ws.loadbalancer.server.port=8000"

  mongo:
    image: mongo:latest
    restart: always
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - frontend_build:/usr/share/nginx/html
      - ./nginx/conf/app.conf:/etc/nginx/conf.d/default.conf
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    depends_on:
      - frontend
    networks:
      - NexiosNet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nexiosdigital-frontend.rule=Host(`nexiosdigital.com`) && !PathPrefix(`/api`, `/ws`)"
      - "traefik.http.routers.nexiosdigital-frontend.entrypoints=websecure"
      - "traefik.http.routers.nexiosdigital-frontend.tls=true"
      - "traefik.http.services.nexiosdigital-frontend.loadbalancer.server.port=80"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mongo_data:
  frontend_build: