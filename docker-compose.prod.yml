version: '3.3'

networks:
  # Use a rede existente do proxy
  proxy:
    external: true
  # Rede interna para comunicação entre seus serviços
  internal:

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    volumes:
      - frontend_build:/app/build
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - SECRET_KEY=${SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
    depends_on:
      - mongo
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      # Rota para API REST
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-backend.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/api`)"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-backend.loadbalancer.server.port=8000"
      # Rota para WebSockets - Nova configuração
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-ws.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-ws.service=${COMPOSE_PROJECT_NAME}-ws-service"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-ws-service.loadbalancer.server.port=8000"
      # Configurações específicas para WebSocket
      - "traefik.http.middlewares.svc-websocket.websocket.pingInterval=30s"
      - "traefik.http.middlewares.svc-websocket.websocket.pingTimeout=10s"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-ws.middlewares=svc-websocket"

  mongo:
    image: mongo:latest
    restart: always
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - frontend_build:/usr/share/nginx/html
      - ./nginx/custom.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-frontend.loadbalancer.server.port=80"

volumes:
  mongo_data:
  frontend_build: